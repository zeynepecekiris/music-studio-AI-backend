<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Music Studio AI - Story Template</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #080514;
    font-family: 'Nunito', sans-serif;
    position: relative;
  }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 15% 8%,  #3a0a6e 0%, transparent 55%),
      radial-gradient(ellipse 60% 45% at 88% 18%, #0a1a6e 0%, transparent 50%),
      radial-gradient(ellipse 70% 55% at 5%  75%, #1e0a55 0%, transparent 55%),
      radial-gradient(ellipse 65% 50% at 90% 80%, #0a0035 0%, transparent 50%),
      linear-gradient(175deg, #120620 0%, #080514 45%, #08080f 100%);
    animation: bgBreath 9s ease-in-out infinite;
  }
  @keyframes bgBreath { 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.18);} }

  .orb { position:absolute; border-radius:50%; filter:blur(110px); pointer-events:none; }
  .orb1 { width:750px; height:750px; background:radial-gradient(circle,#bb00ff2e,transparent 70%); top:-120px; left:-180px; animation:orbA 10s ease-in-out infinite; }
  .orb2 { width:620px; height:620px; background:radial-gradient(circle,#0077ff26,transparent 70%); top:500px; right:-200px; animation:orbB 13s ease-in-out infinite; }
  .orb3 { width:820px; height:820px; background:radial-gradient(circle,#ff009922,transparent 70%); bottom:250px; left:-140px; animation:orbC 15s ease-in-out infinite; }
  .orb4 { width:500px; height:500px; background:radial-gradient(circle,#00eeff1a,transparent 70%); bottom:80px; right:-80px; animation:orbD 11s ease-in-out infinite; }
  @keyframes orbA { 0%,100%{transform:translate(0,0) scale(1);}   50%{transform:translate(60px,80px) scale(1.12);} }
  @keyframes orbB { 0%,100%{transform:translate(0,0) scale(1);}   50%{transform:translate(-50px,-70px) scale(1.1);} }
  @keyframes orbC { 0%,100%{transform:translate(0,0) scale(1);}   50%{transform:translate(70px,-50px) scale(1.08);} }
  @keyframes orbD { 0%,100%{transform:translate(0,0) scale(1);}   50%{transform:translate(-40px,60px) scale(1.15);} }

  .grid {
    position:absolute; inset:0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 90px 90px;
  }

  /* Notes */
  .notes-container { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .note { position:absolute; opacity:0; animation:noteRise 7s ease-in-out infinite; filter:drop-shadow(0 0 12px rgba(200,100,255,0.6)); font-size:56px; }
  .note:nth-child(1) { left:6%;  top:8%;  animation-delay:0s;   font-size:48px; }
  .note:nth-child(2) { left:83%; top:6%;  animation-delay:1.2s; font-size:66px; }
  .note:nth-child(3) { left:4%;  top:38%; animation-delay:2.4s; font-size:42px; }
  .note:nth-child(4) { left:88%; top:35%; animation-delay:0.6s; font-size:58px; }
  .note:nth-child(5) { left:12%; top:68%; animation-delay:1.8s; font-size:62px; }
  .note:nth-child(6) { left:82%; top:65%; animation-delay:3.2s; font-size:46px; }
  .note:nth-child(7) { left:47%; top:3%;  animation-delay:2.8s; font-size:54px; }
  .note:nth-child(8) { left:38%; top:88%; animation-delay:0.4s; font-size:50px; }
  .note:nth-child(9) { left:68%; top:78%; animation-delay:1.6s; font-size:44px; }
  @keyframes noteRise {
    0%  { opacity:0; transform:translateY(40px) rotate(-12deg) scale(0.8); }
    18% { opacity:0.65; }
    75% { opacity:0.55; }
    100%{ opacity:0; transform:translateY(-80px) rotate(18deg) scale(1.1); }
  }

  /* Sparkles */
  .sparkle { position:absolute; border-radius:50%; background:white; animation:sparkleAnim 3.5s ease-in-out infinite; }
  @keyframes sparkleAnim { 0%,100%{opacity:0;transform:scale(0) rotate(0deg);} 50%{opacity:1;transform:scale(1) rotate(180deg);} }

  /* Dynamic Island */
  .dynamic-island {
    position:absolute; top:24px; left:50%; transform:translateX(-50%);
    width:210px; height:42px; background:#000; border-radius:24px; z-index:30;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
  }

  /* Status Bar */
  .status-bar {
    position:absolute; top:0; left:0; right:0; height:88px;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 64px 18px; z-index:20;
  }
  .status-time { font-size:34px; font-weight:900; color:rgba(255,255,255,0.45); letter-spacing:1px; }
  .status-right { display:flex; gap:18px; align-items:center; }
  .status-right span { font-size:30px; color:rgba(255,255,255,0.4); }

  /* Main layout */
  .content {
    position:relative; z-index:10;
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 110px 72px 170px;
    gap: 0;
  }

  /* Top: icon floats above name */
  .top-section {
    display:flex; flex-direction:column; align-items:center;
    margin-bottom: 80px;
    animation: fadeInDown 1s ease both;
  }
  @keyframes fadeInDown { from{opacity:0;transform:translateY(-30px);} to{opacity:1;transform:translateY(0);} }

  .app-icon {
    width:220px; height:220px; border-radius:56px;
    background:linear-gradient(145deg, #ff00cc, #8800ff 50%, #00aaff);
    display:flex; align-items:center; justify-content:center;
    font-size:114px;
    box-shadow: 0 0 50px #ff00cc55, 0 0 110px #8800ff44, 0 0 200px #8800ff22, 0 30px 60px #00000077;
    animation: iconFloat 3.5s ease-in-out infinite;
    margin-bottom: 60px;
  }
  @keyframes iconFloat {
    0%,100% { transform:translateY(0px) scale(1); box-shadow:0 0 50px #ff00cc55, 0 0 110px #8800ff44, 0 0 200px #8800ff22, 0 30px 60px #00000077; }
    50%     { transform:translateY(-38px) scale(1.04); box-shadow:0 0 80px #ff00ccaa, 0 0 160px #8800ff77, 0 0 260px #8800ff33, 0 50px 90px #00000066; }
  }

  .app-name {
    font-family:'Righteous', cursive; font-size:116px; line-height:1;
    background:linear-gradient(130deg, #ff44dd, #cc44ff, #44aaff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(0 0 40px #cc00ff66);
    letter-spacing:3px; text-align:center;
  }
  .app-ai-badge {
    display:inline-flex; align-items:center;
    margin-top:22px;
    background:linear-gradient(90deg, #ff00cc22, #8800ff33, #00aaff22);
    border:1.5px solid rgba(255,255,255,0.18);
    border-radius:50px; padding:14px 50px;
    backdrop-filter:blur(20px);
  }
  .app-ai-badge span { font-size:42px; font-weight:900; letter-spacing:12px; color:rgba(255,255,255,0.5); text-transform:uppercase; }

  /* Player Card */
  .player-card {
    width:100%;
    background:rgba(255,255,255,0.055);
    border:1.5px solid rgba(255,255,255,0.12);
    border-radius:50px; padding:60px 66px;
    backdrop-filter:blur(40px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
    animation: cardIn 1.2s ease 0.3s both;
    margin-bottom: 72px;
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(40px) scale(0.97);} to{opacity:1;transform:translateY(0) scale(1);} }

  .now-playing-row { display:flex; align-items:center; gap:20px; margin-bottom:46px; }
  .dot-pulse {
    width:18px; height:18px; border-radius:50%; background:#ff00cc;
    box-shadow:0 0 16px #ff00cccc;
    animation:dotPulse 1.5s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.6);opacity:0.55;} }
  .now-playing-label { font-size:34px; font-weight:700; letter-spacing:8px; text-transform:uppercase; color:rgba(255,255,255,0.35); }

  .wave-container { display:flex; align-items:center; justify-content:center; gap:9px; height:130px; width:100%; }
  .wave-bar {
    flex:1; max-width:16px; border-radius:8px;
    background:linear-gradient(to top, #8800ff, #ff00cc, #00ccff);
    box-shadow:0 0 18px #ff00cc66;
    animation:waveAnim 1.3s ease-in-out infinite;
  }
  .wave-bar:nth-child(1)  { animation-delay:0.00s; }
  .wave-bar:nth-child(2)  { animation-delay:0.08s; }
  .wave-bar:nth-child(3)  { animation-delay:0.16s; }
  .wave-bar:nth-child(4)  { animation-delay:0.24s; }
  .wave-bar:nth-child(5)  { animation-delay:0.32s; }
  .wave-bar:nth-child(6)  { animation-delay:0.40s; }
  .wave-bar:nth-child(7)  { animation-delay:0.48s; }
  .wave-bar:nth-child(8)  { animation-delay:0.56s; }
  .wave-bar:nth-child(9)  { animation-delay:0.64s; }
  .wave-bar:nth-child(10) { animation-delay:0.72s; }
  .wave-bar:nth-child(11) { animation-delay:0.80s; }
  .wave-bar:nth-child(12) { animation-delay:0.88s; }
  .wave-bar:nth-child(13) { animation-delay:0.96s; }
  .wave-bar:nth-child(14) { animation-delay:0.88s; }
  .wave-bar:nth-child(15) { animation-delay:0.80s; }
  .wave-bar:nth-child(16) { animation-delay:0.72s; }
  .wave-bar:nth-child(17) { animation-delay:0.64s; }
  .wave-bar:nth-child(18) { animation-delay:0.56s; }
  .wave-bar:nth-child(19) { animation-delay:0.48s; }
  .wave-bar:nth-child(20) { animation-delay:0.40s; }
  .wave-bar:nth-child(21) { animation-delay:0.32s; }
  .wave-bar:nth-child(22) { animation-delay:0.24s; }
  .wave-bar:nth-child(23) { animation-delay:0.16s; }
  .wave-bar:nth-child(24) { animation-delay:0.08s; }
  @keyframes waveAnim { 0%,100%{height:14px;opacity:0.35;} 50%{height:118px;opacity:1;} }

  .progress-row { display:flex; align-items:center; gap:26px; margin-top:46px; }
  .prog-time { font-size:30px; color:rgba(255,255,255,0.35); font-weight:700; min-width:80px; }
  .prog-track { flex:1; height:8px; background:rgba(255,255,255,0.12); border-radius:4px; overflow:hidden; position:relative; }
  .prog-fill { height:100%; width:42%; background:linear-gradient(90deg, #8800ff, #ff00cc, #00ccff); border-radius:4px; box-shadow:0 0 16px #ff00cc88; animation:progAnim 8s linear infinite; }
  @keyframes progAnim { 0%{width:5%;} 100%{width:95%;} }

  /* Tagline */
  .tagline-section { text-align:center; animation:fadeInUp 1.2s ease 0.6s both; }
  .tagline { font-size:60px; font-weight:900; color:white; line-height:1.35; text-shadow:0 0 50px rgba(180,60,255,0.45); }
  .tagline .hl { background:linear-gradient(90deg, #ff00cc, #aa44ff, #00ccff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  @keyframes fadeInUp { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }

  /* Bottom Badge */
  .badge {
    position:absolute; bottom:88px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.07); border:1.5px solid rgba(255,255,255,0.13);
    border-radius:72px; padding:28px 76px;
    backdrop-filter:blur(30px); white-space:nowrap;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    animation:badgeIn 1.4s ease 1s both;
  }
  @keyframes badgeIn { from{opacity:0;transform:translateX(-50%) translateY(24px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
  .badge-text { font-size:38px; font-weight:700; color:rgba(255,255,255,0.75); letter-spacing:2px; }
  .badge-text .brand { color:#ff44cc; }
</style>
</head>
<body>

<div class="bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="orb orb4"></div>
<div class="grid"></div>

<!-- iOS Dynamic Island -->
<div class="dynamic-island"></div>

<!-- iOS Status Bar -->
<div class="status-bar">
  <div class="status-time">9:41</div>
  <div class="status-right">
    <span>▲▲▲</span>
    <span>WiFi</span>
    <span>🔋</span>
  </div>
</div>

<!-- Floating Music Notes -->
<div class="notes-container">
  <div class="note">🎵</div>
  <div class="note">🎶</div>
  <div class="note">🎵</div>
  <div class="note">🎶</div>
  <div class="note">🎵</div>
  <div class="note">🎶</div>
  <div class="note">🎵</div>
  <div class="note">🎶</div>
  <div class="note">🎵</div>
</div>

<!-- Sparkles -->
<div class="sparkle" style="top:9%;left:18%;width:10px;height:10px;box-shadow:0 0 14px white;animation-delay:0.3s;"></div>
<div class="sparkle" style="top:22%;left:78%;width:7px;height:7px;background:#ff00cc;box-shadow:0 0 10px #ff00cc;animation-delay:1.4s;"></div>
<div class="sparkle" style="top:50%;left:8%;width:8px;height:8px;background:#00ccff;box-shadow:0 0 12px #00ccff;animation-delay:2.2s;"></div>
<div class="sparkle" style="top:60%;left:91%;width:7px;height:7px;background:#aa44ff;box-shadow:0 0 10px #aa44ff;animation-delay:0.8s;"></div>
<div class="sparkle" style="top:78%;left:30%;width:11px;height:11px;box-shadow:0 0 16px white;animation-delay:1.9s;"></div>
<div class="sparkle" style="top:33%;left:55%;width:6px;height:6px;background:#ffcc00;box-shadow:0 0 10px #ffcc00;animation-delay:3.1s;"></div>

<!-- Main Content -->
<div class="content">

  <div class="top-section">
    <div class="app-icon">🎧</div>
    <div class="app-name">Music Studio</div>
    <div class="app-ai-badge"><span>AI</span></div>
  </div>

  <div class="player-card">
    <div class="now-playing-row">
      <div class="dot-pulse"></div>
      <div class="now-playing-label">Now Playing</div>
    </div>
    <div class="wave-container">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="progress-row">
      <div class="prog-time">1:24</div>
      <div class="prog-track"><div class="prog-fill"></div></div>
      <div class="prog-time" style="text-align:right;">3:18</div>
    </div>
  </div>

  <div class="tagline-section">
    <div class="tagline">AI ile <span class="hl">kendi müziğini</span><br>sen yarat ✨</div>
  </div>

</div>

<div class="badge">
  <div class="badge-text">🎵 <span class="brand">Music Studio AI</span> ile oluşturuldu</div>
</div>

</body>
</html>
